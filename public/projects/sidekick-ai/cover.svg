<svg width="1440" height="1080" viewBox="0 0 1440 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sidekick-bg" x1="132" y1="92" x2="1300" y2="996" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111318" />
      <stop offset="1" stop-color="#08090C" />
    </linearGradient>
    <linearGradient id="sidekick-panel" x1="252" y1="216" x2="1084" y2="792" gradientUnits="userSpaceOnUse">
      <stop stop-color="#241B3C" />
      <stop offset="1" stop-color="#140F24" />
    </linearGradient>
    <linearGradient id="sidekick-accent" x1="1002" y1="250" x2="1138" y2="686" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" />
      <stop offset="1" stop-color="#B45309" />
    </linearGradient>
    <filter id="sidekick-blur" x="0" y="0" width="1440" height="1080" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>
  <rect width="1440" height="1080" rx="72" fill="url(#sidekick-bg)" />
